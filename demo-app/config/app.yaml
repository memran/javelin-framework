app:
  name: Javelin App
  env: local

server:
  host: 127.0.0.1
  port: 8080

database:
  default: primary
  migrations_dir: database/migrations
  query:
    timing: true
    slow_ms: 100
    log_all: false
  connections:
    primary:
      driver: postgresql
      host: localhost
      port: 5432
      database: app
      username: postgres
      password: secret
      max_pool_size: 10
      minimum_idle: 2
      connection_timeout_ms: 5000

json:
  indent_output: false
  fail_on_unknown_properties: false
  write_nulls: true

session:
  cookie_name: javelin_session
  ttl_seconds: 1800
  secure: true
  http_only: true
  same_site: Lax

log:
  channel: console
  path: storage/logs/app.log
  request_logging: true
  request_id_header: X-Request-ID
  correlation_id_header: X-Correlation-ID
  level:
    root: INFO
    io:
      netty: WARN

errors:
  redact: true
  pages_dir: errors
  redact_keys:
    - password
    - token
    - authorization
    - cookie
    - api_key

security:
  max_request_bytes: 1048576

providers:
  - app.providers.AppServiceProvider
  - io.javelin.json.jackson.JacksonJsonServiceProvider
  - io.javelin.exception.ExceptionHandlerServiceProvider
  - io.javelin.security.SessionServiceProvider

javelin:
  starter:
    http-driver: ${http.driver}
