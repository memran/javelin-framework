app:
  name: Javelin App
  env: local

server:
  host: 127.0.0.1
  port: 8080

database:
  default: primary
  migrations_dir: database/migrations
  query:
    timing: true
    slow_ms: 100
    log_all: false
  connections:
    primary:
      driver: postgresql
      host: localhost
      port: 5432
      database: app
      username: postgres
      password: secret
      max_pool_size: 10
      minimum_idle: 2
      connection_timeout_ms: 5000

json:
  indent_output: false
  fail_on_unknown_properties: false
  write_nulls: true

session:
  cookie_name: javelin_session
  ttl_seconds: 1800
  secure: true
  http_only: true
  same_site: Lax

cache:
  driver: memory
  caffeine:
    maximum_size: 10000
    default_ttl_seconds: 0

queue:
  driver: file
  worker:
    enabled: true
    concurrency: 2
    poll_interval_ms: 500
    lease_seconds: 60
    timeout_seconds: 300
    shutdown_seconds: 10
  retry:
    backoff: exponential
    initial_ms: 1000
    max_ms: 60000
  file:
    dir: storage/queues/file

storage:
  default: public
  disks:
    public:
      driver: local
      root: storage/app/public
      domain: /files/
      max_bytes: 10485760
    private:
      driver: local
      root: storage/app/private
      domain: /files/
      public: false
    temporary:
      driver: local
      root: storage/app/tmp
      domain: /files/

log:
  channel: console
  path: storage/logs/app.log
  request_logging: true
  request_id_header: X-Request-ID
  correlation_id_header: X-Correlation-ID
  level:
    root: INFO
    io:
      netty: WARN

errors:
  redact: true
  pages_dir: errors
  redact_keys:
    - password
    - token
    - authorization
    - cookie
    - api_key

security:
  max_request_bytes: 1048576
  password:
    hash: pbkdf2
    bcrypt_cost: 12
  jwt:
    secret: "demo-only-secret-change-me"
    issuer: ""
    audience: ""
    ttl_seconds: 3600
  hsts:
    enabled: false
  csp: ""

cors:
  allowed_origins:
    - http://localhost:5173
  allow_credentials: false
  max_age_seconds: 600

secrets:
  dir: secrets

mail:
  driver: test
  from: no-reply@javelin.local
  test:
    dir: storage/mail
  retry:
    max_attempts: 3
    backoff_ms: 1000

scheduler:
  enabled: true
  poll_interval_ms: 1000
  lock_ttl_seconds: 120
  timezone: UTC
  owner: demo
  history: memory
  lock: memory

observability:
  enabled: true
  health_path: /health
  ready_path: /ready
  metrics_path: /metrics
  tracing: none

provider:
  directory: modules
  strict: false
  enabled: []
  disabled: []

providers:
  - app.providers.AppServiceProvider
  - io.javelin.json.jackson.JacksonJsonServiceProvider
  - io.javelin.exception.ExceptionHandlerServiceProvider
  - io.javelin.security.SessionServiceProvider
  - io.javelin.security.CsrfServiceProvider
  - io.javelin.security.SessionAuthServiceProvider
  - io.javelin.security.JwtAuthServiceProvider
  - io.javelin.security.CorsServiceProvider
  - io.javelin.validation.ValidationServiceProvider
  - io.javelin.config.SecretsServiceProvider
  - io.javelin.storage.StorageServiceProvider
  - io.javelin.cache.caffeine.CaffeineCacheServiceProvider
  - io.javelin.events.EventServiceProvider
  - io.javelin.scheduler.SchedulerServiceProvider
  - io.javelin.mail.MailServiceProvider
  - io.javelin.providers.ProviderRegistryServiceProvider
  - io.javelin.observability.ObservabilityServiceProvider
  - io.javelin.queue.QueueServiceProvider
  - io.javelin.queue.file.FileQueueServiceProvider

javelin:
  starter:
    http-driver: ${http.driver}
