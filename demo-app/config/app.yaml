app:
  name: Javelin App
  env: local

server:
  host: 127.0.0.1
  port: 8080

database:
  driver: postgresql
  host: localhost
  port: 5432
  database: app
  username: postgres
  password: secret

log:
  channel: console
  path: storage/logs/app.log
  request_logging: true
  request_id_header: X-Request-ID
  correlation_id_header: X-Correlation-ID
  level:
    root: INFO
    io:
      netty: WARN

errors:
  redact: true
  pages_dir: errors
  redact_keys:
    - password
    - token
    - authorization
    - cookie
    - api_key

security:
  max_request_bytes: 1048576

providers:
  - app.providers.AppServiceProvider
  - io.javelin.exception.ExceptionHandlerServiceProvider

javelin:
  starter:
    http-driver: ${http.driver}
