# Container config for demo-app. Copied over config/app.yaml in the runtime image.
# Unlike config/app.yaml this file is not Maven-filtered, so placeholders stay
# available for environment substitution at runtime.
app:
  name: Javelin Demo App
  env: ${APP_ENV:prod}

server:
  host: ${SERVER_HOST:0.0.0.0}
  port: ${SERVER_PORT:8080}
  static_dir: public
  static_cache_seconds: 3600
  static_cache_immutable: false
  request_timeout_seconds: 30
  idle_timeout_seconds: 60

database:
  default: primary
  migrations_dir: database/migrations
  query:
    timing: true
    slow_ms: 100
    log_all: false
  connections:
    primary:
      driver: postgresql
      host: ${DATABASE_HOST:db}
      port: ${DATABASE_PORT:5432}
      database: ${DATABASE_NAME:app}
      username: ${DATABASE_USERNAME:postgres}
      password: ${DATABASE_PASSWORD:secret}
      max_pool_size: 10
      minimum_idle: 2
      connection_timeout_ms: 5000

cache:
  driver: ${CACHE_DRIVER:valkey}
  url: ${VALKEY_URL:redis://valkey:6379}
  caffeine:
    maximum_size: 10000
    default_ttl_seconds: 0

storage:
  default: public
  disks:
    public:
      driver: local
      root: storage/app/public
      domain: /files/
      max_bytes: 10485760
    private:
      driver: local
      root: storage/app/private
      domain: /files/
      public: false
    temporary:
      driver: local
      root: storage/app/tmp
      domain: /files/

queue:
  driver: ${QUEUE_DRIVER:valkey}
  url: ${NATS_URL:nats://nats:4222}
  stream: ${NATS_STREAM:JAVELIN}
  worker:
    enabled: true
    concurrency: 4
    poll_interval_ms: 500
    lease_seconds: 60
    timeout_seconds: 300
    shutdown_seconds: 10
  retry:
    backoff: exponential
    initial_ms: 1000
    max_ms: 60000
  valkey:
    url: ${VALKEY_URL:redis://valkey:6379}
  file:
    dir: storage/queues/file

json:
  indent_output: false
  fail_on_unknown_properties: false
  write_nulls: true

session:
  cookie_name: javelin_session
  ttl_seconds: 1800
  secure: true
  http_only: true
  same_site: Lax

log:
  channel: console
  request_logging: true
  request_id_header: X-Request-ID
  correlation_id_header: X-Correlation-ID
  level:
    root: INFO
    io:
      netty: WARN

errors:
  redact: true
  pages_dir: errors
  redact_keys:
    - password
    - token
    - authorization
    - cookie
    - api_key

security:
  max_request_bytes: 1048576
  trusted_proxies:
    - 127.0.0.1
    - 172.16.0.0/12
  password:
    hash: pbkdf2
    bcrypt_cost: 12
  jwt:
    secret: ${APP_KEY:demo-only-secret-change-me}
    issuer: ""
    audience: ""
    ttl_seconds: 3600
  hsts:
    enabled: true
  csp: "default-src 'self'"

cors:
  allowed_origins:
    - http://localhost:5173
  allow_credentials: false
  max_age_seconds: 600

secrets:
  dir: secrets

mail:
  driver: test
  from: no-reply@javelin.local
  test:
    dir: storage/mail
  retry:
    max_attempts: 3
    backoff_ms: 1000

scheduler:
  enabled: true
  poll_interval_ms: 1000
  lock_ttl_seconds: 120
  timezone: UTC
  owner: ${HOSTNAME:demo}
  history: database
  lock: database

observability:
  enabled: true
  health_path: /health
  ready_path: /ready
  metrics_path: /metrics
  tracing: none

provider:
  directory: modules
  strict: false
  enabled: []
  disabled: []

providers:
  - app.providers.AppServiceProvider
  - io.javelin.json.jackson.JacksonJsonServiceProvider
  - io.javelin.exception.ExceptionHandlerServiceProvider
  - io.javelin.security.SessionServiceProvider
  - io.javelin.security.CsrfServiceProvider
  - io.javelin.security.SessionAuthServiceProvider
  - io.javelin.security.JwtAuthServiceProvider
  - io.javelin.security.CorsServiceProvider
  - io.javelin.validation.ValidationServiceProvider
  - io.javelin.config.SecretsServiceProvider
  - io.javelin.storage.StorageServiceProvider
  - io.javelin.cache.caffeine.CaffeineCacheServiceProvider
  - io.javelin.cache.valkey.ValkeyCacheServiceProvider
  - io.javelin.events.EventServiceProvider
  - io.javelin.scheduler.SchedulerServiceProvider
  - io.javelin.mail.MailServiceProvider
  - io.javelin.providers.ProviderRegistryServiceProvider
  - io.javelin.observability.ObservabilityServiceProvider
  - io.javelin.queue.QueueServiceProvider
  - io.javelin.queue.file.FileQueueServiceProvider
  - io.javelin.queue.database.DatabaseQueueServiceProvider
  - io.javelin.queue.valkey.ValkeyQueueServiceProvider
  - io.javelin.queue.rabbitmq.RabbitMqQueueServiceProvider
  - io.javelin.queue.nats.NatsQueueServiceProvider

javelin:
  starter:
    http-driver: netty
