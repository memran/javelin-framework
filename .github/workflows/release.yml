name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify and package
        run: mvn -B clean verify
      - name: Collect jars
        run: |
          mkdir -p dist
          find modules -path '*/target/*.jar' ! -name '*-sources.jar' -exec cp {} dist/ \;
          cp demo-app/target/javelin-demo-app-*.jar dist/
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
